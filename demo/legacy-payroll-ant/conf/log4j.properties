# DELIBERATELY LEGACY. See ../README.md.
# Log4j 1.x configuration. End of life since 2015.

log4j.rootLogger=DEBUG, FILE, CONSOLE

# DEBUG to a file on the application server's local disk, with no rotation limit
# beyond a daily roll and no retention policy. This filled the disk in 2016.
log4j.appender.FILE=org.apache.log4j.DailyRollingFileAppender
log4j.appender.FILE.File=/opt/jboss/server/default/log/payroll.log
log4j.appender.FILE.DatePattern='.'yyyy-MM-dd
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{ISO8601} %-5p [%t] %c{1} - %m%n

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%-5p %c{1} - %m%n

# SQL logging at DEBUG, which writes bind values - including salary - to the log file.
log4j.logger.com.acme.payroll.dao=DEBUG
log4j.logger.org.apache.struts=DEBUG

# A SocketAppender pointed at a log server that was decommissioned in 2012. Every
# application start blocks for the connection timeout before giving up.
log4j.appender.REMOTE=org.apache.log4j.net.SocketAppender
log4j.appender.REMOTE.RemoteHost=logserver01.acme.internal
log4j.appender.REMOTE.Port=4560
